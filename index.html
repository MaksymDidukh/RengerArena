<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RengerArena</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23050805'/><polygon points='30,20 80,50 30,80 40,50' fill='none' stroke='%2300ff00' stroke-width='7' stroke-linejoin='round'/><circle cx='80' cy='50' r='10' fill='%23ff0055'/><circle cx='80' cy='50' r='18' stroke='%23ff0055' stroke-width='4' fill='none'/><line x1='50' y1='50' x2='62' y2='50' stroke='%2300ffff' stroke-width='6' stroke-linecap='round'/></svg>">
    <style>
        body { margin: 0; overflow: hidden; background: #050805; font-family: 'Segoe UI', sans-serif; touch-action: none; cursor: crosshair; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 15px; color: #0f0; pointer-events: none; z-index: 10; }
        .hp-bar-bg { width: 200px; height: 16px; background: rgba(255, 0, 0, 0.2); border: 1px solid #f00; margin-bottom: 5px; border-radius: 3px; overflow: hidden; }
        .hp-bar-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.1s ease; }
        .joystick-container { position: absolute; bottom: 40px; width: 110px; height: 110px; background: rgba(0, 255, 0, 0.05); border: 1px solid rgba(0, 255, 0, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        #move-container { left: 30px; }
        #shoot-container { right: 30px; border-color: rgba(255, 50, 50, 0.3); }
        .stick { width: 45px; height: 45px; background: rgba(0, 255, 0, 0.3); border-radius: 50%; pointer-events: none; }
        #shoot-stick { background: rgba(255, 50, 50, 0.3); }
        #dash-btn { position: absolute; bottom: 170px; right: 45px; width: 65px; height: 65px; background: rgba(0, 255, 0, 0.1); border: 2px solid #0f0; border-radius: 50%; color: #0f0; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; user-select: none; }
    </style>
</head>
<body>

<div id="ui">
    <div style="font-size: 14px; font-weight: bold;">HP: <span id="hp-text">100/100</span></div>
    <div class="hp-bar-bg"><div id="hp-fill" class="hp-bar-fill"></div></div>
    <div style="font-size: 18px;">SCORE: <span id="score">0</span></div>
    <div id="wp-text" style="color: #0ff;">GUN: PISTOL</div>
    <div id="wp-timer" style="color: #ff0;"></div>
    
    <div id="wave-info" style="color: #f0f; font-weight: bold; margin-top: 5px;">
        WAVE 1|17.00s
    </div>
</div>

<div id="move-container" class="joystick-container"><div id="move-stick" class="stick"></div></div>
<div id="shoot-container" class="joystick-container"><div id="shoot-stick" class="stick"></div></div>
<div id="dash-btn">DASH</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- AUDIO ENGINE (Мягкие звуки) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'shoot') {
        osc.type = 'sine'; 
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(60, now + 0.12);
        gain.gain.setValueAtTime(0.05, now); 
        gain.gain.linearRampToValueAtTime(0.001, now + 0.12);
        osc.start(); osc.stop(now + 0.12);
    } else if (type === 'enemyShoot') {
        osc.type = 'triangle'; 
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.15);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.15);
        osc.start(); osc.stop(now + 0.15);
    } else if (type === 'uzi') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        gain.gain.setValueAtTime(0.03, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.06);
        osc.start(); osc.stop(now + 0.06);
    } else if (type === 'hit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(120, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.15);
        osc.start(); osc.stop(now + 0.15);
    } else if (type === 'playerHurt') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.linearRampToValueAtTime(50, now + 0.25);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.25);
        osc.start(); osc.stop(now + 0.25);
    } else if (type === 'powerup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.linearRampToValueAtTime(880, now + 0.25);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.25);
        osc.start(); osc.stop(now + 0.25);
    } else if (type === 'heal') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(600, now + 0.35);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.35);
        osc.start(); osc.stop(now + 0.35);
    } else if (type === 'dash') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(600, now + 0.3);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(); osc.stop(now + 0.3);
    } else if (type === 'explosion') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.linearRampToValueAtTime(30, now + 0.4);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(); osc.stop(now + 0.4);
    }
}

// --- GAME SETTINGS ---
let score = 0;
let wave = 1;
let maxEnemies = 15;
let gameStartTime = Date.now();
const WAVE_INTERVAL = 17000;
let isGameOver = false;

const WEAPONS = {
    PISTOL: { name: "PISTOL", fireRate: 400, color: "#fff", spread: 0.05, count: 1, bSize: 3, speed: 12, sound: 'shoot' },
    UZI: { name: "UZI", fireRate: 110, color: "#0ff", spread: 0.15, count: 1, bSize: 2, speed: 15, sound: 'uzi' },
    SHOTGUN: { name: "SHOTGUN", fireRate: 800, color: "#f90", spread: 0.5, count: 6, bSize: 3, speed: 9, sound: 'shoot' },
    MG: { name: "MINIGUN", fireRate: 80, color: "#ff0", spread: 0.04, count: 1, bSize: 3, speed: 16, sound: 'uzi' }
};

const player = {
    x: 0, y: 0, radius: 11, angle: 0, speed: 4.5,
    hp: 100, maxHp: 100, invulnerableTime: 0,
    weapon: WEAPONS.PISTOL, wpTimer: 0, lastShot: 0,
    isDashing: false, dashTime: 0, dashCooldown: 0
};

let enemies = [], bullets = [], enemyBullets = [], powerups = [], splatters = [], explosions = [];
const controls = { move: { x: 0, y: 0, tId: null }, shoot: { x: 0, y: 0, active: false, tId: null } };
const keys = {};
const mouse = { x: 0, y: 0, isDown: false, active: false };

function getEnemyColor(type) {
    if (type === 'shooter') return "#bb00ff";
    if (type === 'flanker') return "#ff8800";
    if (type === 'evader') return "#00ff00";
    return "#ff0055";
}

function triggerExplosion(x, y, radius, damage, color) {
    playSound('explosion');
    explosions.push({
        x: x, y: y,
        maxRadius: radius,
        currentRadius: 0,
        color: color,
        duration: 20,
        timer: 20
    });

    let dToPlayer = Math.hypot(player.x - x, player.y - y);
    if (dToPlayer < radius + player.radius) {
        takeDamage(damage);
    }
}

// Генерация брызг крови (мощные при смерти или мини-брызги при попадании)
function createBloodSplatters(x, y, isHit = false, hitAngle = 0) {
    let charDiameter = player.radius * 2; 
    let minScale = isHit ? 0.4 : 2.0;  
    let maxScale = isHit ? 1.2 : 10.0; 
    
    let spreadRadius = charDiameter * (minScale + Math.random() * (maxScale - minScale));
    let baseColor = "#b3002d"; 

    let pointsCount = isHit ? (4 + Math.floor(Math.random() * 4)) : (12 + Math.floor(Math.random() * 10));
    let splatterPoints = [];
    
    let mainAngle = isHit ? hitAngle + (Math.random() - 0.5) * 0.8 : (Math.random() * Math.PI * 2);

    for (let i = 0; i < pointsCount; i++) {
        let ang = mainAngle + (Math.random() - 0.5) * 1.5;
        let dist = Math.random() * spreadRadius;
        let pSize = (Math.random() * 0.3 + 0.05) * spreadRadius;
        splatterPoints.push({ angle: ang, dist: dist, size: pSize });
    }

    // Случайное время жизни крови от 0.5 до 7 секунд (в миллисекундах)
    let randomDuration = (Math.random() * (7.0 - 0.5) + 0.5) * 1000;

    splatters.push({
        x: x,
        y: y,
        mainRadius: spreadRadius * (isHit ? 0.2 : 0.35),
        color: baseColor,
        spawnTime: Date.now(),
        duration: randomDuration, // сохраняем индивидуальное время жизни
        points: splatterPoints
    });
}

function killEnemy(en, index, wasExploded = false) {
    let enemyColor = getEnemyColor(en.type);
    
    createBloodSplatters(en.x, en.y, false);

    if (wasExploded || en.isExplosive) {
        triggerExplosion(en.x, en.y, 65, 18, enemyColor);
    }

    enemies.splice(index, 1);
    score += en.type === 'shooter' ? 20 : (en.type === 'evader' ? 25 : (en.type === 'flanker' ? 15 : 10));

    // Проверяем, меньше ли у игрока 30% здоровья
    let isLowHp = player.hp < player.maxHp * 0.3;
    // Базовый шанс выпадения предмета 20%, если HP < 30%, увеличиваем шанс на 30% (суммарно 50%)
    let dropChance = isLowHp ? 0.5 : 0.2;

    if (Math.random() < dropChance) {
        let randType = Math.random();
        let pType;
        
        if (isLowHp) {
            // При низком HP делаем повышенный приоритет на выпадение аптечки (например, 60% шанс на HEAL среди всех бонусов)
            pType = randType < 0.6 ? "HEAL" : ["UZI", "SHOTGUN", "MG"][Math.floor(Math.random() * 3)];
        } else {
            // Обычное распределение в штатном режиме
            pType = randType < 0.3 ? "HEAL" : ["UZI", "SHOTGUN", "MG"][Math.floor(Math.random() * 3)];
        }

        powerups.push({
            x: en.x,
            y: en.y,
            type: pType,
            spawnTime: Date.now()
        });
    }
}

function triggerDash() {
    if (player.dashCooldown <= 0) {
        player.isDashing = true;
        player.dashTime = 30;
        player.dashCooldown = 120;
        playSound('dash');
    }
}

function takeDamage(amount) {
    if (player.isDashing || player.invulnerableTime > 0 || isGameOver) return;
    
    player.hp -= amount;
    player.invulnerableTime = 30;
    playSound('playerHurt');

    if (player.hp <= 0) {
        player.hp = 0;
        isGameOver = true;
        setTimeout(() => {
            resetGame();
        }, 1000);
    }
}

function resetGame() {
    score = 0;
    wave = 1;
    maxEnemies = 15;
    gameStartTime = Date.now();
    enemies = [];
    bullets = [];
    enemyBullets = [];
    powerups = [];
    splatters = [];
    explosions = [];
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.hp = player.maxHp;
    player.invulnerableTime = 0;
    player.weapon = WEAPONS.PISTOL;
    player.wpTimer = 0;
    isGameOver = false;
}

// --- CONTROLS LISTENERS ---
window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
window.addEventListener('mousedown', (e) => { if (e.button === 0) { mouse.isDown = true; mouse.active = true; } });
window.addEventListener('mouseup', (e) => { if (e.button === 0) mouse.isDown = false; });

window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if ((e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') && !e.repeat) triggerDash();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function pollGamepadAndKeyboard() {
    let inputMoveX = 0, inputMoveY = 0;
    let inputShootX = 0, inputShootY = 0;
    let isShooting = false;

    if (keys['KeyW'] || keys['ArrowUp']) inputMoveY -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) inputMoveY += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) inputMoveX -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) inputMoveX += 1;

    if (inputMoveX !== 0 && inputMoveY !== 0) {
        inputMoveX *= 0.7071;
        inputMoveY *= 0.7071;
    }

    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of gamepads) {
        if (!gp) continue;
        if (Math.abs(gp.axes[0]) > 0.15) inputMoveX = gp.axes[0];
        if (Math.abs(gp.axes[1]) > 0.15) inputMoveY = gp.axes[1];

        if (gp.axes.length >= 4) {
            if (Math.abs(gp.axes[2]) > 0.15 || Math.abs(gp.axes[3]) > 0.15) {
                inputShootX = gp.axes[2];
                inputShootY = gp.axes[3];
                isShooting = true;
            }
        }

        if (gp.buttons[0]?.pressed || gp.buttons[1]?.pressed || gp.buttons[10]?.pressed) triggerDash();
    }

    if (controls.move.tId !== null) { inputMoveX = controls.move.x; inputMoveY = controls.move.y; }

    if (controls.shoot.tId !== null) {
        inputShootX = controls.shoot.x;
        inputShootY = controls.shoot.y;
        isShooting = true;
    } else if (mouse.isDown) {
        player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        isShooting = true;
    } else if (mouse.active) {
        player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    } else if (isShooting) {
        controls.shoot.x = inputShootX;
        controls.shoot.y = inputShootY;
    }

    controls.move.x = inputMoveX;
    controls.move.y = inputMoveY;
    controls.shoot.active = isShooting;
}

function setupControls() {
    const mZone = document.getElementById('move-container'), sZone = document.getElementById('shoot-container'), dBtn = document.getElementById('dash-btn');

    const handleStart = (e) => {
        for (let t of e.changedTouches) {
            if (isInside(t, mZone) && controls.move.tId === null) { controls.move.tId = t.identifier; updateJoy(t, mZone, 'move'); }
            else if (isInside(t, sZone) && controls.shoot.tId === null) { controls.shoot.tId = t.identifier; updateJoy(t, sZone, 'shoot'); }
            else if (isInside(t, dBtn)) { triggerDash(); }
        }
    };

    const handleMove = (e) => {
        for (let t of e.changedTouches) {
            if (t.identifier === controls.move.tId) updateJoy(t, mZone, 'move');
            if (t.identifier === controls.shoot.tId) updateJoy(t, sZone, 'shoot');
        }
    };

    const handleEnd = (e) => {
        for (let t of e.changedTouches) {
            if (t.identifier === controls.move.tId) { controls.move.tId = null; controls.move.x = 0; controls.move.y = 0; document.getElementById('move-stick').style.transform = `translate(0,0)`; }
            if (t.identifier === controls.shoot.tId) { controls.shoot.tId = null; controls.shoot.active = false; document.getElementById('shoot-stick').style.transform = `translate(0,0)`; }
        }
    };

    window.addEventListener('touchstart', handleStart);
    window.addEventListener('touchmove', handleMove);
    window.addEventListener('touchend', handleEnd);
}

function isInside(t, el) { let r = el.getBoundingClientRect(); return t.clientX >= r.left && t.clientX <= r.right && t.clientY >= r.top && t.clientY <= r.bottom; }

function updateJoy(t, zone, type) {
    let r = zone.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
    let dx = t.clientX - cx, dy = t.clientY - cy, dist = Math.min(50, Math.sqrt(dx*dx + dy*dy)), ang = Math.atan2(dy, dx);
    document.getElementById(type + '-stick').style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px)`;
    controls[type].x = dx/50; controls[type].y = dy/50;
    if (type === 'shoot') controls.shoot.active = true;
}

// --- GAME LOOP ---
function update() {
    if (isGameOver) return;

    pollGamepadAndKeyboard();

    let elapsed = Date.now() - gameStartTime;
    let currentWaveNum = Math.floor(elapsed / WAVE_INTERVAL) + 1;
    if (currentWaveNum > wave) {
        wave = currentWaveNum;
        maxEnemies *= 2;
    }
    let msToNextWave = WAVE_INTERVAL - (elapsed % WAVE_INTERVAL);
    let timeToNextWaveStr = (msToNextWave / 1000).toFixed(2);

    let s = player.isDashing ? player.speed * 2.5 : player.speed;
    let nx = player.x + controls.move.x * s, ny = player.y + controls.move.y * s;
    if (nx > player.radius && nx < canvas.width - player.radius) player.x = nx;
    if (ny > player.radius && ny < canvas.height - player.radius) player.y = ny;

    if (player.isDashing && --player.dashTime <= 0) player.isDashing = false;
    if (player.dashCooldown > 0) player.dashCooldown--;
    if (player.invulnerableTime > 0) player.invulnerableTime--;

    if (controls.shoot.active) {
        if (controls.shoot.x !== 0 || controls.shoot.y !== 0) {
            player.angle = Math.atan2(controls.shoot.y, controls.shoot.x);
        }

        if (Date.now() - player.lastShot > player.weapon.fireRate) {
            for(let i=0; i<player.weapon.count; i++) {
                let dev = (Math.random()-0.5) * player.weapon.spread;
                bullets.push({ x: player.x, y: player.y, vx: Math.cos(player.angle+dev)*player.weapon.speed, vy: Math.sin(player.angle+dev)*player.weapon.speed, c: player.weapon.color, r: player.weapon.bSize });
            }
            playSound(player.weapon.sound);
            player.lastShot = Date.now();
        }
    }

    explosions.forEach((exp, ei) => {
        exp.timer--;
        exp.currentRadius = exp.maxRadius * (1 - exp.timer / exp.duration);
    });
    explosions = explosions.filter(exp => exp.timer > 0);

    for (let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        let dx = player.x - en.x, dy = player.y - en.y, d = Math.hypot(dx, dy);
        let angleToEnemy = Math.atan2(-dy, -dx); 
        let angleDiff = Math.abs(player.angle - angleToEnemy);
        if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

        if (en.dodgeCooldown > 0) en.dodgeCooldown--;

        if (en.type === 'evader' && d < 28) {
            killEnemy(en, i, true);
            continue;
        }

        if ((en.type === 'evader' || en.type === 'flanker') && controls.shoot.active && angleDiff < 0.35 && d < 250 && en.dodgeCooldown <= 0) {
            en.dodgeDir = Math.random() < 0.5 ? 1 : -1;
            en.dodgeTimer = 18;
            en.dodgeCooldown = 60;
        }

        if ((en.type === 'evader' || en.type === 'flanker') && en.dodgeCooldown <= 0) {
            for (let b of bullets) {
                let bdist = Math.hypot(b.x - en.x, b.y - en.y);
                if (bdist < 60) {
                    let pAngle = Math.atan2(b.vy, b.vx);
                    let toEnemyAngle = Math.atan2(en.y - b.y, en.x - b.x);
                    let diff = Math.abs(pAngle - toEnemyAngle);
                    if (diff > Math.PI) diff = Math.PI * 2 - diff;
                    
                    if (diff < 0.6) { 
                        en.dodgeDir = Math.random() < 0.5 ? 1 : -1;
                        en.dodgeTimer = 15;
                        en.dodgeCooldown = 50;
                        break;
                    }
                }
            }
        }

        if (en.dodgeTimer > 0) {
            en.dodgeTimer--;
            let perpAngle = Math.atan2(dy, dx) + (Math.PI / 2) * en.dodgeDir;
            en.x += Math.cos(perpAngle) * en.speed * 2.2;
            en.y += Math.sin(perpAngle) * en.speed * 2.2;
        } else {
            if (en.type === 'shooter') {
                if (d > 200) { en.x += (dx/d) * en.speed; en.y += (dy/d) * en.speed; }
                else if (d < 130) { en.x -= (dx/d) * en.speed; en.y -= (dy/d) * en.speed; }

                if (Date.now() - en.lastShot > en.fireRate) {
                    let ang = Math.atan2(dy, dx);
                    enemyBullets.push({ x: en.x, y: en.y, vx: Math.cos(ang) * 5, vy: Math.sin(ang) * 5, r: 4 });
                    playSound('enemyShoot');
                    en.lastShot = Date.now();
                }
            } else if (en.type === 'flanker') {
                let targetAngle = player.angle + en.flankAngle; 
                let targetX = player.x + Math.cos(targetAngle) * en.flankDist;
                let targetY = player.y + Math.sin(targetAngle) * en.flankDist;

                let fdx = targetX - en.x, fdy = targetY - en.y, fd = Math.hypot(fdx, fdy);

                if (d < 100 || fd < 20) {
                    en.x += (dx/d) * en.speed * 1.2;
                    en.y += (dy/d) * en.speed * 1.2;
                } else {
                    en.x += (fdx/fd) * en.speed;
                    en.y += (fdy/fd) * en.speed;
                }
            } else if (en.type === 'evader') {
                en.x += (dx/d) * en.speed;
                en.y += (dy/d) * en.speed;
            } else {
                en.x += (dx/d) * en.speed;
                en.y += (dy/d) * en.speed;
            }
        }

        if (d < player.radius + en.radius) {
            takeDamage(6);
        }

        bullets.forEach((b, bi) => {
            if (Math.hypot(b.x - en.x, b.y - en.y) < en.radius + 12) {
                en.hp -= 1;
                
                let hitAngle = Math.atan2(b.vy, b.vx);
                createBloodSplatters(b.x, b.y, true, hitAngle);

                bullets.splice(bi, 1);
                playSound('hit');

                if (en.hp <= 0) {
                    killEnemy(en, i);
                }
            }
        });
    }

    const nowTime = Date.now();
    // Фильтрация крови по ее индивидуальному времени жизни (от 0.5 до 4 сек)
    splatters = splatters.filter(s => (nowTime - s.spawnTime) < s.duration);

    enemyBullets.forEach((eb, ebi) => {
        eb.x += eb.vx;
        eb.y += eb.vy;

        if (Math.hypot(player.x - eb.x, player.y - eb.y) < player.radius + eb.r) {
            takeDamage(7);
            enemyBullets.splice(ebi, 1);
        }
    });
    enemyBullets = enemyBullets.filter(eb => eb.x > 0 && eb.x < canvas.width && eb.y > 0 && eb.y < canvas.height);

    bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
    bullets = bullets.filter(b => b.x > 0 && b.x < canvas.width && b.y > 0 && b.y < canvas.height);

    const now = Date.now();
    powerups.forEach((p, i) => {
        if (Math.hypot(player.x-p.x, player.y-p.y) < 30) {
            if (p.type === "HEAL") {
                player.hp = Math.min(player.maxHp, player.hp + 30);
                playSound('heal');
            } else {
                player.weapon = WEAPONS[p.type];
                player.wpTimer = 600;
                playSound('powerup');
            }
            powerups.splice(i,1);
        }
    });
    powerups = powerups.filter(p => (now - p.spawnTime) < 7000);

    if (player.wpTimer > 0) player.wpTimer--; else player.weapon = WEAPONS.PISTOL;

    document.getElementById('hp-text').innerText = `${player.hp}/${player.maxHp}`;
    const hpFill = document.getElementById('hp-fill');
    hpFill.style.width = `${(player.hp / player.maxHp) * 100}%`;
    hpFill.style.background = player.hp < 30 ? '#f00' : (player.hp < 60 ? '#ff0' : '#0f0');

    document.getElementById('score').innerText = score;
    document.getElementById('wp-text').innerText = "GUN: " + player.weapon.name;
    document.getElementById('wp-timer').innerText = player.wpTimer > 0 ? (player.wpTimer/60).toFixed(1) + "s" : "";
    document.getElementById('wave-info').innerText = `WAVE ${wave}|${timeToNextWaveStr}s→`;
}

function draw() {
    ctx.fillStyle = "rgba(5, 10, 5, 0.4)"; ctx.fillRect(0, 0, canvas.width, canvas.height);

    const now = Date.now();

    // Отрисовка брызг крови на земле с плавным затуханием в конце их жизни
    splatters.forEach(s => {
        let age = now - s.spawnTime;
        let alpha = 0.5;
        let fadeStart = s.duration - 500; // Начинает затухать за 0.5 сек до конца
        if (age > fadeStart) {
            alpha = 0.5 * (1 - (age - fadeStart) / (s.duration - fadeStart));
        }
        if (alpha > 0) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, alpha);
            ctx.fillStyle = s.color;
            
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.mainRadius, 0, Math.PI * 2);
            ctx.fill();

            s.points.forEach(pt => {
                ctx.beginPath();
                ctx.arc(s.x + Math.cos(pt.angle) * pt.dist, s.y + Math.sin(pt.angle) * pt.dist, pt.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }
    });

    explosions.forEach(exp => {
        ctx.save();
        ctx.strokeStyle = exp.color;
        ctx.lineWidth = 3;
        ctx.globalAlpha = exp.timer / exp.duration;
        ctx.beginPath();
        ctx.arc(exp.x, exp.y, exp.currentRadius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = exp.color;
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
            let px = exp.x + Math.cos(a) * exp.currentRadius;
            let py = exp.y + Math.sin(a) * exp.currentRadius;
            ctx.beginPath();
            ctx.arc(px, py, 3, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    });

    powerups.forEach(p => {
        let timeLeftMs = 7000 - (now - p.spawnTime);
        if (timeLeftMs > 2000 || Math.floor(now / 100) % 2 === 0) {
            if (p.type === "HEAL") {
                ctx.fillStyle = "#0f0";
                ctx.beginPath();
                ctx.arc(p.x, p.y, 9, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#fff";
                ctx.fillRect(p.x - 2, p.y - 5, 4, 10);
                ctx.fillRect(p.x - 5, p.y - 2, 10, 4);
            } else {
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
                ctx.fill();
            }

            ctx.fillStyle = "#ff0";
            ctx.font = "bold 11px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText((Math.max(0, timeLeftMs) / 1000).toFixed(2) + "s", p.x, p.y - 14);
        }
    });
    
    if (!isGameOver && player.invulnerableTime % 4 < 2) {
        ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
        ctx.strokeStyle = player.isDashing ? "#fff" : "#0f0"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(-7,-8); ctx.lineTo(-7,8); ctx.closePath(); ctx.stroke();
        ctx.restore();
    }

    bullets.forEach(b => { ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); });

    enemyBullets.forEach(eb => {
        ctx.fillStyle = "#ff0055";
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI*2);
        ctx.fill();
    });

    enemies.forEach(en => {
        let enemyColor = getEnemyColor(en.type);
        ctx.fillStyle = enemyColor;
        ctx.beginPath();
        ctx.arc(en.x, en.y, en.radius, 0, Math.PI*2);
        ctx.fill();

        if (en.type === 'shooter') {
            ctx.fillStyle = "#0ff";
            ctx.fillRect(en.x - 3, en.y - 3, 6, 6);
        } else if (en.type === 'evader') {
            ctx.strokeStyle = "#000";
            ctx.strokeRect(en.x - 3, en.y - 3, 6, 6);
        } else {
            ctx.strokeStyle = en.isExplosive ? "#ff0" : "#fff";
            ctx.strokeRect(en.x - 3, en.y - 3, 6, 6);
        }

        const barW = 24;
        const barH = 4;
        const barX = en.x - barW / 2;
        const barY = en.y - en.radius - 8;

        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(barX, barY, barW, barH);

        ctx.fillStyle = en.hp === en.maxHp ? "#0f0" : "#f90";
        ctx.fillRect(barX, barY, (en.hp / en.maxHp) * barW, barH);

        ctx.strokeStyle = "#000";
        ctx.lineWidth = 1;
        ctx.strokeRect(barX, barY, barW, barH);
    });

    if (isGameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f00";
        ctx.font = "bold 36px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
    }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

setInterval(() => {
    if (!isGameOver && enemies.length < maxEnemies) {
        let x, y, s = Math.floor(Math.random()*4);
        if(s==0){x=Math.random()*canvas.width; y=-30;} else if(s==1){x=Math.random()*canvas.width; y=canvas.height+30;}
        else if(s==2){x=-30; y=Math.random()*canvas.height;} else {x=canvas.width+30; y=canvas.height+30;}
        
        let randAI = Math.random();
        let type = 'chaser';
        if (randAI < 0.25) type = 'shooter';
        else if (randAI < 0.50) type = 'flanker';
        else if (randAI < 0.75) type = 'evader';

        enemies.push({
            x, y,
            radius: 11,
            speed: type === 'shooter' ? 1.5 : (type === 'evader' ? 2.5 : (type === 'flanker' ? 2.2 : 2.0)),
            type: type,
            isExplosive: type === 'chaser' && Math.random() < 0.3,
            hp: 2,
            maxHp: 2,
            lastShot: Date.now(),
            fireRate: 1500 + Math.random() * 1000,
            flankAngle: (Math.random() < 0.5 ? 1 : -1) * (Math.PI / 2 + Math.random() * 0.8),
            flankDist: 120 + Math.random() * 60,
            dodgeTimer: 0,
            dodgeCooldown: 0,
            dodgeDir: 1
        });
    }
}, 600);

window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
player.x = canvas.width/2; player.y = canvas.height/2;

setupControls();
loop();
</script>
